gateway:
  provider: openrouter
  base_url: https://openrouter.ai/api/v1
  timeout_seconds: 120
  max_retries: 3
hybrid_routing:
  local_threshold_tokens: 2000
  cloud_force_tags:
  - reasoning
  - architecture
  - security
  - consensus
consensus:
  mode: super_judge
  min_models_required: 1
  judge_model_id: anthropic-claude-3.7-sonnet
  conflict_resolution: weighted
  tournament_top_k: 8
  max_concurrent: 30
  jury_timeout: 120             # Increase for Ollama CPU models (slow inference)
token_tracking:
  enabled: true
  warn_threshold: 50000
  session_cap: 500000
self_improve:
  enabled: true
  max_iterations: 3
  test_commands:
    - pytest
    - python -m pytest
    - npm test
    - npm run test
    - go test ./...
    - cargo test
